<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام إدارة المصروفات</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>نظام إدارة المصروفات</h1>
            <p>واجهة احترافية وعصرية لإدارة المصاريف بسهولة</p>
        </div>

        <div class="stats">
            <div class="card">
                <h3>عدد العمليات</h3>
                <span id="count">0</span>
            </div>

            <div class="card">
                <h3>إجمالي المصروفات</h3>
                <span id="topTotal">0 ر.س</span>
            </div>
        </div>

        <div class="form">

            <div class="form-group">
                <label>اسم المنتج</label>
                <input type="text" id="itemName" placeholder="أدخل اسم المنتج">
            </div>

            <div class="form-group">
                <label>السعر</label>
                <input type="number" id="itemPrice" placeholder="أدخل السعر">
            </div>

            <button class="add-btn" onclick="addItem()">
                + إضافة عنصر
            </button>

        </div>

        <div class="table-wrapper">
            <table>

                <thead>
                    <tr>
                        <th>#</th>
                        <th>المنتج</th>
                        <th>السعر</th>
                        <th>حذف</th>
                    </tr>
                </thead>

                <tbody id="tableBody">

                    <tr>
                        <td colspan="4" class="empty">
                            لا توجد بيانات حالياً
                        </td>
                    </tr>

                </tbody>

            </table>
        </div>

        <div class="total-box">
            <h2>الإجمالي النهائي</h2>
            <div class="total" id="totalPrice">0 ر.س</div>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
